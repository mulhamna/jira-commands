name: Zed extension mirror

on:
  pull_request:
    paths:
      - 'crates/zed-jira/**'
      - 'scripts/sync-jirac-ext.sh'
      - '.github/workflows/zed-extension-mirror.yml'
  push:
    branches: [main]
    paths:
      - 'crates/zed-jira/**'
      - 'scripts/sync-jirac-ext.sh'
      - '.github/workflows/zed-extension-mirror.yml'
  workflow_dispatch:

concurrency:
  group: zed-extension-mirror-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-mirror:
    name: Verify jirac-ext mirror stays in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout jirac-ext mirror
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mulhamna/jirac-ext
          path: jirac-ext

      - name: Sync expected mirror contents
        run: ./scripts/sync-jirac-ext.sh "$GITHUB_WORKSPACE/jirac-ext"

      - name: Fail on mirror drift
        run: |
          cd "$GITHUB_WORKSPACE/jirac-ext"
          git diff --exit-code -- . ':(exclude).gitignore'
