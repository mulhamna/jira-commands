name: ClawHub Publish jirac

on:
  push:
    branches: [main]
    paths:
      - 'clawhub/jirac/**'
      - '.github/workflows/clawhub-publish-jirac.yml'

concurrency:
  group: clawhub-publish-jirac
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Validate and publish ClawHub skill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKILL_PATH: clawhub/jirac
      SKILL_SLUG: jirac
      SKILL_NAME: jirac
      SKILL_VERSION_FILE: clawhub/jirac/VERSION
      WORKFLOW_FILE: .github/workflows/clawhub-publish-jirac.yml
      DEFAULT_CHANGELOG: Update ClawHub jirac skill metadata and docs
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pinned ClawHub CLI dependencies
        run: npm ci --prefix .github/clawhub-cli

      - name: Validate auth
        run: |
          test -n "${{ secrets.CLAWHUB_TOKEN }}"
          npx --prefix .github/clawhub-cli clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser
          npx --prefix .github/clawhub-cli clawhub whoami

      - name: Validate skill path
        run: |
          test -d "$SKILL_PATH"
          test -f "$SKILL_PATH/SKILL.md"
          test -f "$SKILL_VERSION_FILE"

      - name: Detect publish-worthy changes
        id: trigger
        shell: bash
        run: |
          set -euo pipefail

          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
            echo "workflow_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet HEAD~1 HEAD -- "$SKILL_PATH"; then
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet HEAD~1 HEAD -- "$WORKFLOW_FILE"; then
            echo "workflow_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run sync
        run: npx --prefix .github/clawhub-cli clawhub sync --dry-run --all --root "$SKILL_PATH"

      - name: Resolve publish metadata
        id: publish_meta
        shell: bash
        run: |
          set -euo pipefail

          RANGE="HEAD~1..HEAD"
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGELOG=$(git log --format=%s ${RANGE} -- "$SKILL_PATH" | sed '/^$/d')
          else
            CHANGELOG=""
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="$DEFAULT_CHANGELOG"
          fi

          VERSION=$(tr -d '[:space:]' < "$SKILL_VERSION_FILE")
          echo "Publish version: $VERSION"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version in $SKILL_VERSION_FILE: $VERSION"
            exit 1
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Publish skill
        if: steps.trigger.outputs.source_changed == 'true'
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3"

            if npx --prefix .github/clawhub-cli clawhub skill publish "$SKILL_PATH" \
              --slug "$SKILL_SLUG" \
              --name "$SKILL_NAME" \
              --version "${{ steps.publish_meta.outputs.version }}" \
              --changelog "${{ steps.publish_meta.outputs.changelog }}"; then
              echo "Publish succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              backoff=$((attempt * 15))
              echo "Publish failed, retrying in ${backoff}s..."
              sleep "$backoff"
            fi
          done

          echo "Publish failed after 3 attempts."
          exit 1

      - name: Skip publish when only workflow wiring changed
        if: steps.trigger.outputs.source_changed != 'true' && steps.trigger.outputs.workflow_changed == 'true'
        run: echo "Skipping publish because only workflow wiring changed; no skill version bump was requested."
