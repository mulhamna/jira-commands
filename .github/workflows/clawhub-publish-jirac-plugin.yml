name: ClawHub Publish jirac Plugin

on:
  push:
    branches: [main]
    paths:
      - 'clawhub/jirac-plugin/**'
      - 'plugin/**'
      - '.github/workflows/clawhub-publish-jirac-plugin.yml'

concurrency:
  group: clawhub-publish-jirac-plugin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Validate and publish ClawHub package wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACKAGE_ROOT: clawhub/jirac-plugin
      PACKAGE_MARKETPLACE: clawhub/jirac-plugin/marketplace.json
      PACKAGE_VERSION_FILE: clawhub/jirac-plugin/VERSION
      PACKAGE_NAME: jirac-plugin
      PACKAGE_DISPLAY_NAME: jirac Plugin
      PLUGIN_MANIFEST: plugin/.claude-plugin/plugin.json
      WORKFLOW_FILE: .github/workflows/clawhub-publish-jirac-plugin.yml
      DEFAULT_CHANGELOG: Update ClawHub jirac plugin wrapper metadata
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pinned ClawHub CLI dependencies
        run: npm ci --prefix .github/clawhub-cli

      - name: Validate auth
        run: |
          test -n "${{ secrets.CLAWHUB_TOKEN }}"
          npx --prefix .github/clawhub-cli clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser
          npx --prefix .github/clawhub-cli clawhub whoami

      - name: Validate wrapper metadata
        run: |
          set -euo pipefail
          test -d "$PACKAGE_ROOT"
          test -f "$PACKAGE_MARKETPLACE"
          test -f "$PACKAGE_VERSION_FILE"
          test -f "$PACKAGE_ROOT/CHANGELOG.md"
          test -f "$PLUGIN_MANIFEST"

          PACKAGE_VER=$(tr -d '[:space:]' < "$PACKAGE_VERSION_FILE")
          MARKETPLACE_VER=$(jq -r '.metadata.version' "$PACKAGE_MARKETPLACE")
          MARKETPLACE_PLUGIN_VER=$(jq -r '.plugins[0].version' "$PACKAGE_MARKETPLACE")
          MARKETPLACE_PLUGIN_PATH=$(jq -r '.plugins[0].source.path' "$PACKAGE_MARKETPLACE")

          test "$PACKAGE_VER" = "$MARKETPLACE_VER"
          test "$PACKAGE_VER" = "$MARKETPLACE_PLUGIN_VER"
          test "$MARKETPLACE_PLUGIN_PATH" = "../../plugin"

      - name: Detect publish-worthy changes
        id: trigger
        shell: bash
        run: |
          set -euo pipefail

          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
            echo "workflow_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet HEAD~1 HEAD -- "$PACKAGE_ROOT" plugin; then
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet HEAD~1 HEAD -- "$WORKFLOW_FILE"; then
            echo "workflow_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve publish metadata
        id: publish_meta
        shell: bash
        run: |
          set -euo pipefail

          RANGE="HEAD~1..HEAD"
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGELOG=$(git log --format=%s ${RANGE} -- "$PACKAGE_ROOT" plugin | sed '/^$/d')
          else
            CHANGELOG=""
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="$DEFAULT_CHANGELOG"
          fi

          VERSION=$(tr -d '[:space:]' < "$PACKAGE_VERSION_FILE")
          echo "Publish version: $VERSION"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version in $PACKAGE_VERSION_FILE: $VERSION"
            exit 1
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare staged bundle package
        id: staged_bundle
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_DIR=$(mktemp -d)
          cp -R plugin/. "$BUNDLE_DIR/"
          cp "$PACKAGE_ROOT/README.md" "$BUNDLE_DIR/README.md"
          cp "$PACKAGE_ROOT/CHANGELOG.md" "$BUNDLE_DIR/CHANGELOG.md"
          cp "$PACKAGE_VERSION_FILE" "$BUNDLE_DIR/VERSION"

          DESCRIPTION=$(jq -r '.metadata.description' "$PACKAGE_MARKETPLACE")
          jq -n \
            --arg id "$PACKAGE_NAME" \
            --arg name "$PACKAGE_DISPLAY_NAME" \
            --arg description "$DESCRIPTION" \
            '{
              id: $id,
              name: $name,
              description: $description,
              activation: { onStartup: false },
              configSchema: {
                type: "object",
                additionalProperties: false,
                properties: {}
              }
            }' > "$BUNDLE_DIR/openclaw.plugin.json"

          echo "bundle_dir=$BUNDLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Dry-run package publish
        run: |
          npx --prefix .github/clawhub-cli clawhub package publish "${{ steps.staged_bundle.outputs.bundle_dir }}" \
            --family bundle-plugin \
            --name "$PACKAGE_NAME" \
            --display-name "$PACKAGE_DISPLAY_NAME" \
            --version "${{ steps.publish_meta.outputs.version }}" \
            --dry-run \
            --source-repo "https://github.com/${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref_name }}"

      - name: Publish package
        if: steps.trigger.outputs.source_changed == 'true'
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3"

            if npx --prefix .github/clawhub-cli clawhub package publish "${{ steps.staged_bundle.outputs.bundle_dir }}" \
              --family bundle-plugin \
              --name "$PACKAGE_NAME" \
              --display-name "$PACKAGE_DISPLAY_NAME" \
              --version "${{ steps.publish_meta.outputs.version }}" \
              --changelog "${{ steps.publish_meta.outputs.changelog }}" \
              --source-repo "https://github.com/${{ github.repository }}" \
              --source-commit "${{ github.sha }}" \
              --source-ref "${{ github.ref_name }}"; then
              echo "Publish succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              backoff=$((attempt * 15))
              echo "Publish failed, retrying in ${backoff}s..."
              sleep "$backoff"
            fi
          done

          echo "Publish failed after 3 attempts."
          exit 1

      - name: Skip publish when only workflow wiring changed
        if: steps.trigger.outputs.source_changed != 'true' && steps.trigger.outputs.workflow_changed == 'true'
        run: echo "Skipping publish because only workflow wiring changed; no package version bump was requested."
