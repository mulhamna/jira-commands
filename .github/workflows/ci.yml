name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      rust: ${{ steps.filter.outputs.rust }}
      rust_core: ${{ steps.filter.outputs.rust_core }}
      rust_cli: ${{ steps.filter.outputs.rust_cli }}
      rust_mcp: ${{ steps.filter.outputs.rust_mcp }}
      plugin: ${{ steps.filter.outputs.plugin }}
      plugin_release: ${{ steps.filter.outputs.plugin_release }}
      clawhub: ${{ steps.filter.outputs.clawhub }}
      docs: ${{ steps.filter.outputs.docs }}
      release: ${{ steps.filter.outputs.release }}
      workspace_meta: ${{ steps.filter.outputs.workspace_meta }}
      any_code: ${{ steps.filter.outputs.any_code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse "$HEAD_SHA~1")
          fi

          changed() {
            local name="$1"
            shift
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$@"; then
              echo "$name=false" >> "$GITHUB_OUTPUT"
            else
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          }

          changed workflows \
            '.github/workflows/**'

          changed rust \
            'Cargo.toml' \
            'Cargo.lock' \
            'deny.toml' \
            'crates/**'

          changed rust_core \
            'Cargo.toml' \
            'Cargo.lock' \
            'crates/jira-core/**'

          changed rust_cli \
            'Cargo.toml' \
            'Cargo.lock' \
            'crates/jira/**'

          changed rust_mcp \
            'Cargo.toml' \
            'Cargo.lock' \
            'crates/jira-mcp/**'

          changed plugin \
            'plugin/**' \
            '.claude-plugin/**'

          changed plugin_release \
            'plugin/VERSION' \
            'plugin/CHANGELOG.md' \
            'plugin/.claude-plugin/plugin.json' \
            '.claude-plugin/marketplace.json'

          changed clawhub \
            'clawhub/**'

          changed docs \
            'README.md' \
            'INSTALL.md' \
            'docs/**' \
            '.github/PULL_REQUEST_TEMPLATE.md' \
            'plugin/README.md' \
            'clawhub/jirac-plugin/README.md' \
            'crates/jira/README.md' \
            'crates/jira-core/README.md' \
            'crates/jira-mcp/README.md' \
            'packaging/winget/**' \
            'packaging/winget-mcp/**' \
            'packaging/scoop/**' \
            'packaging/npm/**' \
            'packaging/npm-mcp/**' \
            'install.ps1'

          changed release \
            'release-please-config.json' \
            'release-please-config-mcp.json' \
            '.release-please-manifest.json' \
            '.release-please-manifest-mcp.json' \
            'VERSION' \
            'CHANGELOG.md'

          changed workspace_meta \
            '.github/CODEOWNERS' \
            '.github/dependabot.yml' \
            'install.sh' \
            'install.ps1' \
            'SECURITY.md' \
            'LICENSE' \
            'LICENSE-MIT' \
            'LICENSE-APACHE'

      - id: any_code
        run: |
          if [ "${{ steps.filter.outputs.workflows }}" = 'true' ] || \
             [ "${{ steps.filter.outputs.rust }}" = 'true' ] || \
             [ "${{ steps.filter.outputs.plugin }}" = 'true' ] || \
             [ "${{ steps.filter.outputs.release }}" = 'true' ] || \
             [ "${{ steps.filter.outputs.workspace_meta }}" = 'true' ]; then
            echo "any_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_code=false" >> "$GITHUB_OUTPUT"
          fi

  docs-check:
    name: Docs & version check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any_code == 'true' || needs.changes.outputs.docs == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check workspace crate version consistency
        run: |
          CORE_VER=$(grep '^version' crates/jira-core/Cargo.toml | head -1 | sed 's/^version = "\([^"]*\)".*/\1/')
          MCP_VER=$(grep '^version' crates/jira-mcp/Cargo.toml | head -1 | sed 's/^version = "\([^"]*\)".*/\1/')
          BIN_VER=$(grep '^version' crates/jira/Cargo.toml | head -1 | sed 's/^version = "\([^"]*\)".*/\1/')
          MCP_LANE_VER=$(tr -d '[:space:]' < crates/jira-mcp/VERSION)

          echo "jira-core:     $CORE_VER"
          echo "jira-mcp:      $MCP_VER"
          echo "jira-mcp lane: $MCP_LANE_VER"
          echo "jira-commands: $BIN_VER"

          if [ "$CORE_VER" != "$BIN_VER" ]; then
            echo ""
            echo "ERROR: jira-core and jira-commands workspace versions must stay aligned."
            exit 1
          fi

          if [ "$MCP_VER" != "$MCP_LANE_VER" ]; then
            echo ""
            echo "ERROR: jira-mcp crate version must match crates/jira-mcp/VERSION."
            exit 1
          fi

      - name: Check workspace CHANGELOG entry exists for current version
        run: |
          VERSION=$(grep '^version' crates/jira-core/Cargo.toml | head -1 | sed 's/^version = "\([^"]*\)".*/\1/')
          if grep -qF "[${VERSION}]" CHANGELOG.md 2>/dev/null \
            || grep -qF "[${VERSION}]" crates/jira-core/CHANGELOG.md 2>/dev/null \
            || grep -qF "[${VERSION}]" crates/jira/CHANGELOG.md 2>/dev/null; then
            echo "✓ CHANGELOG entry found for workspace v${VERSION}"
          else
            echo "WARNING: No CHANGELOG entry found for workspace v${VERSION} in any location."
          fi

      - name: Check Claude plugin release lane files
        if: needs.changes.outputs.plugin == 'true' || needs.changes.outputs.plugin_release == 'true'
        run: |
          test -f plugin/VERSION
          test -f plugin/CHANGELOG.md
          PLUGIN_VER=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          PLUGIN_LANE_VER=$(cat plugin/VERSION | tr -d '[:space:]')
          MARKETPLACE_VER=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          MARKETPLACE_PLUGIN_VER=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)

          echo "plugin manifest:   $PLUGIN_VER"
          echo "plugin lane:       $PLUGIN_LANE_VER"
          echo "marketplace meta:  $MARKETPLACE_VER"
          echo "marketplace item:  $MARKETPLACE_PLUGIN_VER"

          if [ "$PLUGIN_VER" != "$PLUGIN_LANE_VER" ] || [ "$PLUGIN_VER" != "$MARKETPLACE_VER" ] || [ "$PLUGIN_VER" != "$MARKETPLACE_PLUGIN_VER" ]; then
            echo "ERROR: Claude plugin release lane files are out of sync."
            exit 1
          fi

          if ! grep -qF "[${PLUGIN_VER}]" plugin/CHANGELOG.md; then
            echo "WARNING: plugin/CHANGELOG.md may be missing an entry for ${PLUGIN_VER}."
          fi

      - name: Check ClawHub jirac skill files
        if: needs.changes.outputs.clawhub == 'true' || needs.changes.outputs.workflows == 'true'
        run: |
          test -f clawhub/jirac/SKILL.md
          grep -q '^---' clawhub/jirac/SKILL.md
          grep -q '^name: jirac' clawhub/jirac/SKILL.md
          grep -q '^description:' clawhub/jirac/SKILL.md

      - name: Check ClawHub jirac plugin wrapper files
        if: needs.changes.outputs.clawhub == 'true' || needs.changes.outputs.workflows == 'true'
        run: |
          test -f clawhub/jirac-plugin/marketplace.json
          test -f clawhub/jirac-plugin/VERSION
          test -f clawhub/jirac-plugin/CHANGELOG.md
          test -f plugin/.claude-plugin/plugin.json

          WRAPPER_VER=$(tr -d '[:space:]' < clawhub/jirac-plugin/VERSION)
          MARKETPLACE_VER=$(jq -r '.metadata.version' clawhub/jirac-plugin/marketplace.json)
          MARKETPLACE_PLUGIN_VER=$(jq -r '.plugins[0].version' clawhub/jirac-plugin/marketplace.json)
          MARKETPLACE_PLUGIN_PATH=$(jq -r '.plugins[0].source.path' clawhub/jirac-plugin/marketplace.json)

          test "$WRAPPER_VER" = "$MARKETPLACE_VER"
          test "$WRAPPER_VER" = "$MARKETPLACE_PLUGIN_VER"
          test "$MARKETPLACE_PLUGIN_PATH" = '../../plugin'

      - name: Package ClawHub jirac skill artifact
        if: needs.changes.outputs.clawhub == 'true' || needs.changes.outputs.workflows == 'true'
        run: |
          mkdir -p dist/clawhub/jirac
          cp clawhub/jirac/SKILL.md dist/clawhub/jirac/
          tar -czf clawhub-jirac-skill.tar.gz -C dist/clawhub jirac

      - name: Upload ClawHub jirac skill artifact
        if: needs.changes.outputs.clawhub == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clawhub-jirac-skill
          path: clawhub-jirac-skill.tar.gz
          if-no-files-found: error

      - name: Check README examples and install docs are up to date
        run: |
          VERSION=$(grep '^version' crates/jira-core/Cargo.toml | head -1 | sed 's/^version = "\([^"]*\)".*/\1/')
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          if ! grep -qF "jira-core = \"${MAJOR_MINOR}\"" README.md; then
            echo "WARNING: README.md library example may reference an old jira-core version."
          fi
          if ! grep -qF "jira-core = \"${MAJOR_MINOR}\"" crates/jira-core/README.md; then
            echo "WARNING: crates/jira-core/README.md may reference an old jira-core version."
          fi
          if [ -f install.ps1 ] && ! grep -qF "install.ps1" README.md; then
            echo "WARNING: install.ps1 exists but root README.md does not mention it."
          fi
          if ! grep -qF "scoop install mulhamna/jirac" README.md; then
            echo "ERROR: README.md must document Scoop installation."
            exit 1
          fi
          if ! grep -qF "scoop install mulhamna/jirac-mcp" README.md; then
            echo "ERROR: README.md must document jira-mcp Scoop installation."
            exit 1
          fi
          if ! grep -qF "scoop install mulhamna/jirac" INSTALL.md; then
            echo "ERROR: INSTALL.md must document Scoop installation."
            exit 1
          fi
          if ! grep -qF "scoop install mulhamna/jirac-mcp" INSTALL.md; then
            echo "ERROR: INSTALL.md must document jira-mcp Scoop installation."
            exit 1
          fi
          if ! grep -qF "<!-- contributors:start -->" README.md || ! grep -qF "<!-- contributors:end -->" README.md; then
            echo "ERROR: README.md contributors markers are missing."
            exit 1
          fi

      - name: Install Rust stable (for dry-run publish check)
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.release == 'true' || needs.changes.outputs.workflows == 'true'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.release == 'true' || needs.changes.outputs.workflows == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo publish --dry-run (jira-core)
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.release == 'true' || needs.changes.outputs.workflows == 'true'
        run: cargo publish --dry-run -p jira-core

  check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Workspace compile check
        run: cargo check --workspace --all-targets

  test-core:
    name: Core regression & unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_core == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run jira-core tests
        run: cargo test -p jira-core

  test-cli:
    name: CLI regression & unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_cli == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run jira-commands tests
        run: cargo test -p jira-commands

  test-mcp:
    name: MCP regression & unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_mcp == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run jira-mcp tests
        run: cargo test -p jira-mcp


  plugin-check:
    name: Plugin structure check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.plugin == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate plugin metadata and skills
        run: |
          jq -e '.name and .version and .description and .repository' plugin/.claude-plugin/plugin.json >/dev/null
          test -d plugin/skills
          count=$(find plugin/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "ERROR: expected at least one plugin skill"
            exit 1
          fi
          find plugin/skills -mindepth 2 -maxdepth 2 -name SKILL.md -print0 | while IFS= read -r -d '' file; do
            grep -q '^---' "$file" || { echo "Missing frontmatter: $file"; exit 1; }
            grep -q '^description:' "$file" || { echo "Missing description in $file"; exit 1; }
          done

  npm-check:
    name: npm package check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.release == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Verify npm package versions match release lanes
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          MCP_LANE_VERSION=$(tr -d '[:space:]' < crates/jira-mcp/VERSION)
          NPM_VERSION=$(node -p "require('./packaging/npm/package.json').version")
          NPM_MCP_VERSION=$(node -p "require('./packaging/npm-mcp/package.json').version")

          echo "workspace:     $VERSION"
          echo "mcp lane:      $MCP_LANE_VERSION"
          echo "npm jirac:     $NPM_VERSION"
          echo "npm jirac-mcp: $NPM_MCP_VERSION"

          test "$VERSION" = "$NPM_VERSION"
          test "$MCP_LANE_VERSION" = "$NPM_MCP_VERSION"

      - name: npm pack smoke test (jirac)
        run: |
          rm -f mulham28-jirac-*.tgz
          npm pack ./packaging/npm
          PACKAGE_TGZ=$(ls -1 mulham28-jirac-*.tgz | grep -v 'jirac-mcp' | head -n 1)
          test -n "$PACKAGE_TGZ"
          tar -tzf "$PACKAGE_TGZ" >/dev/null

      - name: npm pack smoke test (jirac-mcp)
        run: |
          rm -f mulham28-jirac-mcp-*.tgz
          npm pack ./packaging/npm-mcp
          PACKAGE_TGZ=$(ls -1 mulham28-jirac-mcp-*.tgz | head -n 1)
          test -n "$PACKAGE_TGZ"
          tar -tzf "$PACKAGE_TGZ" >/dev/null

  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.release == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit
