name: Release Please

# ── HOW THIS WORKS ────────────────────────────────────────────────────────────
# 1. Pushes to main do NOT run this workflow. Batch changes on main first.
#    When ready, run it manually for ONE lane at a time:
#      gh workflow run release-please.yml -f lane=jira-commands
#      gh workflow run release-please.yml -f lane=jira-mcp
#    Merging a Release PR runs it again, only for that PR's lane, to push the
#    tag. That run never opens or refreshes a Release PR.
# 2. A manual run creates/updates the Release PR of the selected lane:
#      - `jira-commands` — covers the root release lane (`.`), which bumps
#        jira-core + jira-commands in lockstep. Tag: vX.Y.Z.
#        Source-of-truth: VERSION file at repo root + `.release-please-manifest.json`.
#      - `jira-mcp` — covers `crates/jira-mcp`. Tag: jira-mcp-vX.Y.Z.
#        Source-of-truth: crates/jira-mcp/VERSION + `.release-please-manifest-mcp.json`.
#    The two lanes intentionally use separate release-please config/manifest
#    files so simultaneous Release PRs do not conflict on one shared manifest.
#    Routing is path-based, not scope-based:
#      - commits touching only `crates/jira-mcp/**`, `packaging/npm-mcp/**`,
#        and/or `Cargo.lock` are eligible for the jira-mcp Release PR.
#      - the root `jira-commands` lane uses explicit `include-paths`, so only
#        root release metadata plus real CLI/core package surfaces
#        (`Cargo.toml`, `VERSION`, `crates/jira/**`, `crates/jira-core/**`,
#        and `packaging/npm/**`) contribute to a root release PR.
#      - ClawHub / Claude wrapper work and release-infra-only maintenance stay
#        outside the root lane unless they also touch one of those included
#        release surfaces.
#    Conventional commit scopes like `feat(mcp):` help the changelog read well,
#    but they do not decide release lane ownership by themselves.
# 3. When you (the owner) merge a Release PR:
#      - release-please pushes the corresponding tag
#      - vX.Y.Z         → release-tag.yml      (builds jirac, publishes jira-core + jira-commands)
#      - jira-mcp-vX.Y.Z → release-tag-mcp.yml (builds jirac-mcp, publishes jira-mcp)
#
# You NEVER need to manually bump versions, update CHANGELOG, or push tags.
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️  REQUIRED SETUP: Personal Access Token (PAT)
# ─────────────────────────────────────────────────────────────────────────────
# The default GITHUB_TOKEN cannot trigger other workflows (GitHub safety rule).
# Without a PAT, release-please creates the tag but release.yml never runs.
#
# One-time setup:
#   1. Go to: https://github.com/settings/personal-access-tokens/new
#   2. Create a fine-grained PAT scoped to this repo with these permissions:
#         - Contents: Read and write
#         - Pull requests: Read and write
#   3. Add it as repo secret: Settings → Secrets → Actions → New secret
#         Name:  RELEASE_PLEASE_TOKEN
#         Value: <paste the PAT>
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Prepare or refresh one lane's Release PR after batching changes.
  workflow_dispatch:
    inputs:
      lane:
        description: Release lane to prepare
        required: true
        type: choice
        options:
          - jira-commands
          - jira-mcp
  # Finalize a merged Release PR into a tag + GitHub Release.
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  sync-npm-version:
    name: Sync npm package version
    # Manual runs, or a merged release-please PR from this repo. Feature PRs
    # never run release-please; the release-please job depends on this one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Sync npm version from VERSION
        id: sync
        run: |
          node scripts/sync-npm-version.mjs
          if git diff --quiet -- packaging/npm/package.json packaging/npm-mcp/package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synced npm package versions
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/npm/package.json packaging/npm-mcp/package.json
          git commit -m "chore(npm): sync package versions with VERSION"
          git push

  release-please:
    name: Release Please
    needs: sync-npm-version
    if: needs.sync-npm-version.outputs.changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    env:
      ROOT_LANE: >-
        ${{ (github.event_name == 'workflow_dispatch' && inputs.lane == 'jira-commands') ||
        github.event.pull_request.head.ref == 'release-please--branches--main--components--jira-commands' }}
      MCP_LANE: >-
        ${{ (github.event_name == 'workflow_dispatch' && inputs.lane == 'jira-mcp') ||
        github.event.pull_request.head.ref == 'release-please--branches--main--components--jira-mcp' }}
      # A merged Release PR only needs its tag; do not open the next Release PR.
      FINALIZE_ONLY: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Verify manifest matches VERSION files
        run: |
          set -euo pipefail
          ROOT_VER=$(cat VERSION)
          MCP_VER=$(cat crates/jira-mcp/VERSION)
          MANIFEST_ROOT=$(jq -r '."."' .release-please-manifest.json)
          MANIFEST_MCP=$(jq -r '."crates/jira-mcp"' .release-please-manifest-mcp.json)
          if [ "$ROOT_VER" != "$MANIFEST_ROOT" ]; then
            echo "::error::manifest root $MANIFEST_ROOT != VERSION $ROOT_VER"
            exit 1
          fi
          if [ "$MCP_VER" != "$MANIFEST_MCP" ]; then
            echo "::error::manifest crates/jira-mcp $MANIFEST_MCP != crates/jira-mcp/VERSION $MCP_VER"
            exit 1
          fi

      - name: Release Please (jira-commands)
        if: env.ROOT_LANE == 'true'
        uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: ${{ env.FINALIZE_ONLY }}

      - name: Release Please (jira-mcp)
        if: env.MCP_LANE == 'true'
        uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4
        id: release-mcp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config-mcp.json
          manifest-file: .release-please-manifest-mcp.json
          skip-github-pull-request: ${{ env.FINALIZE_ONLY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FINALIZE_ONLY != 'true'
        with:
          ref: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0

      - name: Sync npm package versions on each open release PR branch
        if: env.FINALIZE_ONLY != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for COMPONENT in jira-commands jira-mcp; do
            BRANCH=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --head "release-please--branches--main--components--${COMPONENT}" \
              --json headRefName \
              --jq '.[0].headRefName')

            if [ -z "${BRANCH:-}" ] || [ "$BRANCH" = "null" ]; then
              echo "No open release-please branch for ${COMPONENT}; skipping."
              continue
            fi

            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            node scripts/sync-npm-version.mjs

            if git diff --quiet -- packaging/npm/package.json packaging/npm-mcp/package.json; then
              echo "${COMPONENT}: npm package.json files already match VERSION sources."
              continue
            fi

            git add packaging/npm/package.json packaging/npm-mcp/package.json
            git commit -m "chore(npm): sync ${COMPONENT} package version"
            git push origin "HEAD:$BRANCH"
          done
